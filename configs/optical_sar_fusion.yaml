# SatQuery AI - Optical + SAR Two-Stream Fusion Configuration
# Controls dual-stream backbones, fusion mechanisms, ablation modes, and augmentation.

model:
  name: "two-stream-fusion-net"
  backbone: "two_stream_cnn"  # two_stream_cnn, dual_resnet18, cross_attention_fusion
  optical_channels: 4        # 1 for Pan, 3 for RGB, 4 for RGB+NIR, 12 for Sentinel-2
  sar_channels: 2            # 1 for single-pol (VV), 2 for dual-pol (VV+VH)
  num_classes: 3             # 0: Background, 1: Water, 2: Built-up
  feature_dim: 32
  device: "cpu"
  checkpoint_path: "models/checkpoints/two_stream_fusion.pt"
  mock_mode: true

ablation:
  mode: "fused"              # Options: "fused", "optical_only", "sar_only"
  suppress_sar: false        # Set true in optical_only mode
  suppress_optical: false    # Set true in sar_only mode

augmentation:
  resolution_jitter:
    enabled: true
    min_scale: 0.5
    max_scale: 2.0
  speckle_noise:
    enabled: true
    distribution: "gamma"
    looks: 4                 # Equivalent number of looks (ENL)
    variance: 0.15

inference:
  tile_size: 128
  overlap: 32
  confidence_threshold: 0.50
  resample_method: "bilinear" # For co-registering differing optical & SAR ground sample distances
  water_sar_threshold_db: -14.0
  built_up_sar_threshold_db: -2.0
  ndwi_threshold: 0.05

training:
  output_dir: "models/checkpoints/two_stream_fusion"
  epochs: 5
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  loss: "ce_dice"
  datasets:
    - "sen1floods11"
    - "whu_opt_sar"
    - "spacenet6"
