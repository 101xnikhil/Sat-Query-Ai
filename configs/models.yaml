# Models Configuration
models:
  base_vlm:
    name: "Qwen/Qwen2-VL-7B-Instruct"
    device: "cpu"
    lora_checkpoint_dir: "models/checkpoints/vqa_lora"
    max_tokens: 512
  datasets:
    primary: "BigEarthNet"
    additional:
      - "RSVQA"
      - "VRSBench"
      - "CDVQA"
      - "Sen1Floods11"
      - "WHU-OPT-SAR"
      - "SpaceNet6"
    splits_dir: "data/datasets"
  optical_sar_fusion:
    config_path: "configs/optical_sar_fusion.yaml"
    sensor_profiles_path: "configs/sensor_profiles.yaml"
