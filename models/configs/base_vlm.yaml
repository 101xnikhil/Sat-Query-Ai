# Base Vision-Language Model Configuration (Phase 2 - GPU)
model:
  name: "Qwen/Qwen2-VL-2B-Instruct"
  device: "cuda"
  torch_dtype: "float16"
  max_new_tokens: 256
  temperature: 0.2
  use_flash_attn: false
  mock_mode: false

training:
  output_dir: "models/checkpoints/vqa_lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

inference:
  tiling:
    tile_size: 512
    overlap: 64
  nms:
    iou_threshold: 0.50
    score_threshold: 0.30
