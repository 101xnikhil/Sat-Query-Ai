services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: satquery-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - SATQUERY_CONFIG_PATH=/app/config/default_config.yaml
      - PYTHONPATH=/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: satquery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
